<div id="container" style="position: relative; width: 100%; height: 500px; background-color: #000; overflow: hidden; border-radius: 12px;">
    <div id="ruffle-player" style="width: 100%; height: 100%;"></div>
    
    <div id="epiphany-note" style="position: absolute; bottom: 20px; right: 20px; color: #fff; font-family: sans-serif; font-size: 14px; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 5px; z-index: 999; pointer-events: none; animation: fadeOut 1s ease-in 5s forwards;">
        Ported by Epiphany
    </div>
</div>

<style>
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
</style>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        "letterbox": "on",
        "autoplay": "on",
        "unmuteOverlay": "hidden"
    };

    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle-player");
        container.appendChild(player);

        // Standard load for your specific file
        player.load("https://raw.githubusercontent.com/ChenTheIdiot/epiphanydinorunport/main/dinorun%20(1).swf");
    });
</script>
